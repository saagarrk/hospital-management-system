# ====================================================================
# TEST PROFILE CONFIGURATION (Spring Boot Test & H2 In-Memory DB)
# ====================================================================

spring.application.name=hospital-management-system-test
spring.profiles.active=test

# In-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:hospital_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL update for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test JWT Secret Key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

app.cors.allowed-origins=http://localhost:3000
