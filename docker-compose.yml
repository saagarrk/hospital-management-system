version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: hms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-hospital_management_db}
      MYSQL_USER: ${DB_USER:-hms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hms_secure_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-springboot/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend-springboot/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    networks:
      - hms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3.x REST API Backend
  backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/hospital_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USER:-hms_user}
      DB_PASSWORD: ${DB_PASSWORD:-hms_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - hms-network

volumes:
  mysql_data:

networks:
  hms-network:
    driver: bridge
